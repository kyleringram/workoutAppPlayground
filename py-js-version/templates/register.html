<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Workout Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .auth-form .form-group {
            margin-bottom: 15px;
        }
        .auth-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .auth-form input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .auth-form button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .auth-form button:hover {
            background-color: #45a049;
        }
        .auth-links {
            text-align: center;
            margin-top: 15px;
        }
        .flash-messages {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Register</h1>
            <p>Create a new account for Workout Tracker</p>
        </div>

        <div id="flash-messages" class="flash-messages"></div>

        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>

            <button type="submit">Register</button>
        </form>

        <div class="auth-links">
            <p>Already have an account? <a href="/login">Login</a></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('register-form');
            const flashMessages = document.getElementById('flash-messages');

            // Check if user is already logged in
            fetch('/api/auth/user')
                .then(response => response.json())
                .then(data => {
                    if (data.authenticated) {
                        window.location.href = '/';
                    }
                });

            // Handle register form submission
            registerForm.addEventListener('submit', function(event) {
                event.preventDefault();

                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                // Validate form
                if (!username || !email || !password || !confirmPassword) {
                    showFlashMessage('All fields are required.');
                    return;
                }

                if (password !== confirmPassword) {
                    showFlashMessage('Passwords do not match.');
                    return;
                }

                // Create register data
                const registerData = {
                    username: username,
                    email: email,
                    password: password
                };

                // Send register request
                fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registerData)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showFlashMessage(data.error);
                    } else {
                        // Redirect to home page
                        window.location.href = '/';
                    }
                })
                .catch(error => {
                    showFlashMessage('An error occurred. Please try again.');
                    console.error('Error:', error);
                });
            });

            // Show flash message
            function showFlashMessage(message) {
                const flashMessage = document.createElement('div');
                flashMessage.className = 'flash-message';
                flashMessage.textContent = message;

                flashMessages.innerHTML = '';
                flashMessages.appendChild(flashMessage);

                // Auto-remove after 5 seconds
                setTimeout(() => {
                    flashMessage.style.opacity = '0';
                    setTimeout(() => {
                        if (flashMessages.contains(flashMessage)) {
                            flashMessages.removeChild(flashMessage);
                        }
                    }, 500);
                }, 5000);
            }
        });
    </script>
</body>
</html>
